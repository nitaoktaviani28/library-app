apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: library-hpa
  namespace: prestage

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: library-app

  minReplicas: 3
  maxReplicas: 5

  behavior:

    scaleDown:
      stabilizationWindowSeconds: 60

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 60